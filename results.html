<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>SHARPTIPS | Results</title>

<style>

* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}

:root {
    --green: #35e56f;
    --green-dark: #18a94d;
    --gold: #f5c451;
    --white: #f5f7f5;
    --muted: #9aa79f;
    --panel: rgba(7, 15, 10, 0.88);
    --border: rgba(255,255,255,0.10);
    --red: #ff6262;
}

html {
    scroll-behavior: smooth;
}

body {
    font-family: Arial, sans-serif;
    color: var(--white);
    min-height: 100vh;

    background:
        linear-gradient(
            rgba(2, 7, 4, 0.68),
            rgba(2, 7, 4, 0.92)
        ),
        url("background.png") center top / cover fixed no-repeat;
}

/* HEADER */

header {
    min-height: 72px;

    display: flex;
    align-items: center;
    justify-content: space-between;

    border-bottom: 1px solid var(--border);

    background: rgba(3, 9, 5, 0.80);

    backdrop-filter: blur(12px);

    padding: 10px 20px;

    position: sticky;
    top: 0;

    z-index: 1000;
}

.brand {
    display: flex;
    align-items: center;
}

.header-logo {
    width: 190px;
    height: auto;
    display: block;
}

nav {
    display: flex;
    align-items: center;
    gap: 5px;
}

nav a {
    color: #dce5df;
    text-decoration: none;

    font-size: 12px;
    font-weight: 800;

    padding: 10px 11px;

    border-radius: 8px;

    transition: 0.2s;
}

nav a:hover {
    color: var(--green);
    background: rgba(53,229,111,0.08);
}

.account-btn {
    background: var(--green);
    color: #061009 !important;
}

/* CONTAINER */

.container {
    width: 100%;
    max-width: 1250px;

    margin: auto;

    padding: 0 18px 50px;
}

/* HERO */

.hero {
    text-align: center;

    padding: 75px 15px 45px;

    max-width: 900px;

    margin: auto;
}

.hero-badge {
    display: inline-block;

    padding: 9px 17px;

    margin-bottom: 20px;

    border-radius: 30px;

    background: rgba(53,229,111,0.12);

    border: 1px solid rgba(53,229,111,0.35);

    color: var(--green);

    font-size: 12px;

    font-weight: 800;

    letter-spacing: 1px;
}

.hero h1 {
    font-size: clamp(38px, 6vw, 62px);

    line-height: 1.05;

    margin-bottom: 18px;

    font-weight: 900;

    letter-spacing: -1px;
}

.hero h1 span {
    color: var(--green);
}

.hero p {
    max-width: 680px;

    margin: auto;

    color: var(--muted);

    font-size: 17px;

    line-height: 1.7;
}

/* RESULTS AREA */

.results-box {
    max-width: 1000px;

    margin: 10px auto 0;

    background: var(--panel);

    border: 1px solid var(--border);

    border-radius: 20px;

    padding: 25px;

    backdrop-filter: blur(12px);

    box-shadow: 0 20px 50px rgba(0,0,0,0.25);
}

/* RESULT CARD */

.result-card {
    background:
        linear-gradient(
            145deg,
            rgba(17,26,20,0.95),
            rgba(8,13,10,0.96)
        );

    border: 1px solid var(--border);

    border-radius: 16px;

    padding: 22px;

    margin-bottom: 15px;

    transition: 0.2s;
}

.result-card:hover {
    transform: translateY(-2px);

    border-color: rgba(53,229,111,0.30);
}

.result-top {
    display: flex;

    justify-content: space-between;

    align-items: center;

    gap: 15px;

    margin-bottom: 15px;
}

.result-type {
    color: var(--green);

    font-size: 11px;

    font-weight: 800;

    letter-spacing: 1px;
}

.result-match {
    font-size: 20px;

    font-weight: 900;

    color: white;

    margin-bottom: 15px;
}

.result-info {
    display: grid;

    grid-template-columns:
        repeat(3, 1fr);

    gap: 12px;
}

.info-item {
    padding: 13px;

    border-radius: 10px;

    background: rgba(255,255,255,0.035);

    border: 1px solid rgba(255,255,255,0.06);
}

.info-label {
    display: block;

    color: var(--muted);

    font-size: 11px;

    margin-bottom: 6px;

    text-transform: uppercase;
}

.info-value {
    color: white;

    font-weight: 800;

    font-size: 14px;
}

/* STATUS */

.status {
    display: inline-block;

    padding: 8px 13px;

    border-radius: 20px;

    font-size: 11px;

    font-weight: 900;

    letter-spacing: 0.5px;
}

.status.won {
    background: rgba(53,229,111,0.12);

    color: var(--green);

    border: 1px solid rgba(53,229,111,0.25);
}

.status.lost {
    background: rgba(255,98,98,0.12);

    color: var(--red);

    border: 1px solid rgba(255,98,98,0.25);
}

.status.pending {
    background: rgba(245,196,81,0.10);

    color: var(--gold);

    border: 1px solid rgba(245,196,81,0.25);
}

/* EMPTY */

.empty {
    text-align: center;

    padding: 55px 20px;

    color: var(--muted);
}

.empty-icon {
    font-size: 48px;

    margin-bottom: 15px;
}

.empty h2 {
    color: white;

    margin-bottom: 10px;
}

/* FOOTER */

.footer {
    text-align: center;

    color: #66736b;

    font-size: 13px;

    line-height: 1.7;

    padding: 45px 0 10px;
}

/* MOBILE */

@media (max-width: 850px) {

    header {
        flex-direction: column;

        gap: 12px;

        padding: 14px;
    }

    .header-logo {
        width: 170px;
    }

    nav {
        flex-wrap: wrap;

        justify-content: center;
    }

    nav a {
        font-size: 11px;

        padding: 8px 9px;
    }

    .result-info {
        grid-template-columns: 1fr;
    }
}

@media (max-width: 500px) {

    .container {
        padding-left: 12px;

        padding-right: 12px;
    }

    .hero {
        padding-top: 55px;
    }

    .hero h1 {
        font-size: 36px;
    }

    .hero p {
        font-size: 15px;
    }

    .results-box {
        padding: 15px;
    }

    .result-top {
        align-items: flex-start;

        flex-direction: column;
    }
}

</style>
</head>

<body>

<div class="container">

<header>

    <div class="brand">

        <img
            src="header.png"
            class="header-logo"
            alt="SHARPTIPS"
        >

    </div>

    <nav>

        <a href="index.html">
            HOME
        </a>

        <a href="tips.html">
            TIPS
        </a>

        <a href="stats.html">
            STATS
        </a>

        <a href="premium.html">
            PREMIUM
        </a>

        <a href="results.html">
            RESULTS
        </a>

        <a href="about.html">
            ABOUT
        </a>

        <a
            href="customer.html"
            class="account-btn"
        >
            ACCOUNT
        </a>

    </nav>

</header>


<section class="hero">

    <div class="hero-badge">
        📊 VERIFIED PERFORMANCE
    </div>

    <h1>
        SHARPTIPS <span>Results</span>
    </h1>

    <p>
        Track completed football selections,
        winning tips and previous SHARPTIPS
        performance.
    </p>

</section>


<div class="results-box">

    <div id="resultsContainer"></div>

</div>


<footer class="footer">

    <strong style="color:#dce5df;">
        SHARPTIPS
    </strong>

    <br>

    Football analysis, predictions and premium selections.

    <br>

    <span style="color:#4f5b54;">
        © 2026 SHARPTIPS. All rights reserved.
    </span>

</footer>

</div>


<script>

function loadResults() {

    const tips =
        JSON.parse(
            localStorage.getItem("sharpTips")
        ) || [];

    const container =
        document.getElementById(
            "resultsContainer"
        );


    if (tips.length === 0) {

        container.innerHTML = `

            <div class="empty">

                <div class="empty-icon">
                    ⚽
                </div>

                <h2>
                    No Results Yet
                </h2>

                <p>
                    Results will appear here
                    once SHARPTIPS selections
                    have been recorded.
                </p>

            </div>

        `;

        return;
    }


    container.innerHTML = "";


    /*
       Show newest tips first
    */

    const sortedTips =
        [...tips].reverse();


    sortedTips.forEach(function(tip) {

        let result =
            String(
                tip.result ||
                tip.status ||
                ""
            ).toLowerCase();


        let statusClass =
            "pending";

        let statusText =
            "⏳ RESULT PENDING";


        if (
            result === "won" ||
            result === "win"
        ) {

            statusClass =
                "won";

            statusText =
                "✅ WON";

        }


        else if (
            result === "lost" ||
            result === "loss"
        ) {

            statusClass =
                "lost";

            statusText =
                "❌ LOST";

        }


        const type =
            tip.type === "premium"
                ? "💎 PREMIUM"
                : "🆓 FREE";


        container.innerHTML += `

            <div class="result-card">

                <div class="result-top">

                    <div class="result-type">
                        ${type}
                    </div>

                    <span class="
                        status
                        ${statusClass}
                    ">
                        ${statusText}
                    </span>

                </div>


                <div class="result-match">
                    ${tip.match || "Match"}
                </div>


                <div class="result-info">

                    <div class="info-item">

                        <span class="info-label">
                            Prediction
                        </span>

                        <span class="info-value">
                            ${tip.prediction || "-"}
                        </span>

                    </div>


                    <div class="info-item">

                        <span class="info-label">
                            Odds
                        </span>

                        <span class="info-value">
                            ${tip.odds || "-"}
                        </span>

                    </div>


                    <div class="info-item">

                        <span class="info-label">
                            Result
                        </span>

                        <span class="info-value">
                            ${statusText}
                        </span>

                    </div>

                </div>

            </div>

        `;

    });

}


loadResults();

</script>

</body>
</html>
