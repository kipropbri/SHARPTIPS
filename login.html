<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>SHARPTIPS | Admin Login</title>

    <style>

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
        }

        body {
            background: #0b0f0d;
            color: white;
            min-height: 100vh;

            display: flex;
            align-items: center;
            justify-content: center;

            padding: 20px;
        }

        .login-box {
            width: 100%;
            max-width: 420px;

            background: #121a15;

            padding: 35px;

            border-radius: 15px;

            border: 1px solid #26352b;
        }

        .logo {
            text-align: center;

            font-size: 32px;

            font-weight: bold;

            color: #36d66b;

            margin-bottom: 10px;
        }

        .subtitle {
            text-align: center;

            color: #9ba69f;

            margin-bottom: 30px;
        }

        label {
            display: block;

            margin-bottom: 8px;

            font-weight: bold;
        }

        input {
            width: 100%;

            padding: 14px;

            margin-bottom: 20px;

            border-radius: 8px;

            border: 1px solid #34443a;

            background: #0b0f0d;

            color: white;

            font-size: 16px;
        }

        button {
            width: 100%;

            padding: 14px;

            border: none;

            border-radius: 8px;

            background: #36d66b;

            color: #071009;

            font-size: 16px;

            font-weight: bold;

            cursor: pointer;
        }

        button:hover {
            background: #2fc05d;
        }

        .error {
            display: none;

            margin-top: 15px;

            padding: 12px;

            border-radius: 8px;

            background: #421919;

            color: #ff8d8d;

            text-align: center;
        }

        .back {
            display: block;

            text-align: center;

            margin-top: 25px;

            color: #36d66b;

            text-decoration: none;
        }

    </style>

</head>


<body>

<div class="login-box">

    <div class="logo">
        SHARPTIPS
    </div>

    <p class="subtitle">
        Admin Dashboard Login
    </p>


    <form onsubmit="login(event)">

        <label>
            Username
        </label>

        <input
            type="text"
            id="username"
            placeholder="Enter username"
            required
        >


        <label>
            Password
        </label>

        <input
            type="password"
            id="password"
            placeholder="Enter password"
            required
        >


        <button type="submit">
            LOGIN
        </button>

    </form>


    <div id="error" class="error">
        Incorrect username or password.
    </div>


    <a href="index.html" class="back">
        ← Back to SHARPTIPS
    </a>

</div>


<script>

function login(event) {

    event.preventDefault();


    const username =
        document.getElementById("username").value;

    const password =
        document.getElementById("password").value;


    /*
       DEMO LOGIN

       We will replace this with
       secure authentication later.
    */

    const correctUsername = "admin";

    const correctPassword = "sharp123";


    if (
        username === correctUsername &&
        password === correctPassword
    ) {

        sessionStorage.setItem(
            "sharpTipsAdmin",
            "true"
        );


        window.location.href = "admin.html";

    } else {

        document.getElementById(
            "error"
        ).style.display = "block";

    }

}

</script>

</body>

</html>
